name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh
      - name: Zip the app and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "target/release/Keysmith.app" "dist/keysmith-${GITHUB_REF_NAME#v}-macos-arm64.zip"
          (cd dist && shasum -a 256 * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Keysmith $GITHUB_REF_NAME" --generate-notes
